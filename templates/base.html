<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}کلینیک دندانپزشکی ماهلین{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }, colors: { primary: '#1FA7B5', navy: '#12303F', action: '#F97316' } } }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 scroll-smooth">

    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center gap-10">
                <a href="{% url 'home' %}" class="text-2xl font-black text-navy flex items-center gap-2 hover:text-primary transition">🦷 کلینیک ماهلین</a>
                <div class="hidden md:flex gap-6 items-center text-sm">
                    <a href="{% url 'home' %}" class="text-gray-600 hover:text-primary font-bold">صفحه اصلی</a>
                    <a href="{% url 'home' %}#services" class="text-gray-600 hover:text-primary font-bold">خدمات ما</a>
                    <a href="{% url 'home' %}#doctors" class="text-gray-600 hover:text-primary font-bold">پزشکان</a>
                    <a href="{% url 'home' %}#about" class="text-gray-600 hover:text-primary font-bold">درباره ما</a>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <a href="{% url 'book' %}" class="hidden sm:inline-block bg-primary text-white px-5 py-2 rounded-xl font-bold hover:bg-teal-600 transition shadow-md text-sm">رزرو نوبت</a>
                <div class="hidden sm:block w-px h-6 bg-gray-300 mx-2"></div>

                <!-- این همون قسمتیه که به dashboard_router تغییر پیدا کرد -->
                <a href="{% url 'dashboard_router' %}" class="text-gray-700 hover:text-primary transition flex items-center gap-2" title="حساب کاربری">
                    {% if request.user.is_authenticated %}
                        <span class="text-xs font-bold text-primary hidden md:block" dir="ltr">{{ request.user.username }}</span>
                    {% endif %}
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </a>
                
                {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}" class="text-red-500 hover:text-red-700 transition" title="خروج از حساب">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </a>
                {% endif %}
            </div>
            
        </div>
    </nav>

    <main class="min-h-screen pb-10">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-navy text-white text-center py-6 mt-10">
        <p class="text-sm text-gray-400">© ۱۴۰۵ کلینیک دندانپزشکی ماهلین. تمامی حقوق محفوظ است.</p>
    </footer>
</body>
</html>
